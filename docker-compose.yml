version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: midas
      POSTGRES_PASSWORD: midas
      POSTGRES_DB: midas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midas -d midas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://midas:midas@db:5432/midas_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-midas-dev-secret-change-in-prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MOCK_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_BASE_URL: http://api:8000
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://your-app.netlify.app}
    depends_on:
      - api

volumes:
  pgdata:
