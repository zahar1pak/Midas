services:
  - type: web
    name: midas-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./midas_prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_SALT
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
